<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kimlik-jeton" content="__JETON__">
<title>Kimlik Merkezi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--yazi)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--cizgi)}
header h1{font-size:18px;margin:0;flex:1}
.duzen{display:flex;min-height:calc(100vh - 53px)}
nav{width:190px;background:var(--panel);border-right:1px solid var(--cizgi);padding:8px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;margin:2px 0;border:0;background:none;color:var(--yazi);padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button.secili,nav button:hover{background:var(--bg)}
nav button.secili{font-weight:600;color:var(--vurgu)}
main{flex:1;padding:18px 22px;max-width:1280px;min-width:0}
h2{margin-top:0}h3{margin-bottom:6px}
.kart{background:var(--panel);border:1px solid var(--cizgi);border-radius:8px;padding:14px 16px;margin:0 0 14px}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sayi{font-size:26px;font-weight:600}.soluk{color:var(--soluk);font-size:13px}
button.d,a.d{border:1px solid var(--vurgu);background:var(--vurgu);color:var(--vurgu-yazi);padding:7px 14px;border-radius:6px;font:inherit;cursor:pointer}
button.i{border:1px solid var(--cizgi);background:var(--panel);color:var(--yazi);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
button.t{border:1px solid var(--tehlike);background:none;color:var(--tehlike);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--yazi);background:var(--girdi);border:1px solid var(--cizgi);border-radius:6px;padding:6px 9px;max-width:100%}
input[type=text],input[type=search],textarea{width:100%}
textarea{min-height:90px;font-family:Consolas,monospace;font-size:13px}
label{display:inline-block;margin:4px 12px 4px 0}
.satir{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.satir>input[type=text]{flex:1;min-width:200px}
.uyari{border-left:4px solid var(--uyari);padding:8px 12px;background:var(--panel);margin:8px 0}
.hata{border-left:4px solid var(--tehlike);padding:8px 12px;background:var(--panel);margin:8px 0}
.tamam{color:var(--ok)}.kotu{color:var(--tehlike)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--cizgi);vertical-align:top}
th{font-size:13px;color:var(--soluk)}
.kayit{border-bottom:1px solid var(--cizgi);padding:8px 2px}.kayit .m{white-space:pre-wrap;word-break:break-word}
.rozet{display:inline-block;font-size:12px;border:1px solid var(--cizgi);border-radius:10px;padding:0 8px;color:var(--soluk)}
.rozet.h{border-color:var(--tehlike);color:var(--tehlike)}
progress{width:100%;height:14px}
.yer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.pencere{background:var(--panel);border-radius:10px;padding:20px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
#bildirim{position:fixed;right:14px;bottom:14px;max-width:420px;z-index:20}
#bildirim div{background:var(--panel);border:1px solid var(--cizgi);border-left:4px solid var(--vurgu);padding:10px 12px;margin-top:8px;border-radius:6px}
#bildirim div.h{border-left-color:var(--tehlike)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;font-size:12px}
@media(max-width:700px){header{flex-wrap:wrap;gap:8px;padding:8px 12px}header h1{font-size:16px;flex:1 1 100%}header .kisi{flex:1}header select{max-width:140px}nav{width:100%;display:flex;flex-wrap:wrap;border-right:0}.duzen{flex-direction:column}nav button{width:auto}}

</style>
<link rel="stylesheet" href="/statik/harita.css">
</head>
<body>
<header><h1>Kimlik Merkezi</h1><div class="kisi" id="kisi-kutu"></div><button class="i" id="rapor-dugme">Hata raporunu kopyala</button></header>
<div class="duzen"><nav id="nav"></nav><main id="ana"></main></div>
<div id="kok-pencere"></div><div id="bildirim"></div>
<script src="/statik/echarts.min.js"></script>
<script src="/statik/figur.js"></script>
<script src="/statik/harita.js"></script>
<script>
"use strict";
const JETON=document.querySelector('meta[name=kimlik-jeton]').content;
const $=s=>document.querySelector(s);
function h(etiket,ozel,...cocuk){const e=document.createElement(etiket);
  for(const [k,v] of Object.entries(ozel||{})){
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected')e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of cocuk.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;}
// Kayıt metinleri güvenilmez veri: yalnızca textContent/createTextNode ile eklenir, innerHTML kullanılmaz.
let SON_HATA=null,DURUM={},KATEGORILER=[];
async function api(ad,girdi){
  let r,j;
  try{r=await fetch('/api/'+ad,{method:'POST',headers:{'Content-Type':'application/json','X-Kimlik-Jeton':JETON},body:JSON.stringify(girdi||{})});
      j=await r.json();}
  catch(e){SON_HATA={adim:ad,mesaj:'Uygulamaya ulaşılamadı: '+e.message};throw SON_HATA;}
  if(!r.ok){SON_HATA={adim:ad,mesaj:j.hata||('HTTP '+r.status),kod:j.kod,ek:j.ek};throw SON_HATA;}
  return j;}
function bildir(metin,hata){const d=h('div',{class:hata?'h':''},metin);
  if(hata)d.append(h('div',{},h('button',{class:'i',onclick:()=>raporKopyala()},'Hata raporunu kopyala')));
  $('#bildirim').append(d);setTimeout(()=>d.remove(),hata?15000:5000);}
async function hataGoster(e){if(e&&e.mesaj)bildir(e.mesaj,true);else{SON_HATA={adim:'arayüz',mesaj:String(e)};bildir(String(e),true);}}
async function kopyala(metin){
  try{await navigator.clipboard.writeText(metin);}catch(_){
    const t=h('textarea',{},'');document.body.append(t);t.value=metin;t.select();document.execCommand('copy');t.remove();}
  bildir('Panoya kopyalandı.');}
async function raporKopyala(){
  const r=await api('hata_raporu',{adim:SON_HATA?SON_HATA.adim:(sayfa||''),mesaj:SON_HATA?SON_HATA.mesaj:'',ek:SON_HATA&&SON_HATA.ek||''}).catch(()=>({metin:'Rapor üretilemedi.'}));
  kopyala(r.metin);}
$('#rapor-dugme').onclick=raporKopyala;
function yapistirmaKutusu(metin){return h('div',{},h('textarea',{readonly:'',onclick:e=>e.target.select()},metin),
  h('div',{class:'satir'},h('button',{class:'i',onclick:()=>kopyala(metin)},'Kopyala')));}
function pencere(baslik,...icerik){const k=$('#kok-pencere');k.textContent='';
  const kapat=()=>{k.textContent='';};
  k.append(h('div',{class:'yer'},h('div',{class:'pencere',role:'dialog'},h('h2',{},baslik),...icerik)));return kapat;}
function utc(yerel){return yerel?new Date(yerel).toISOString().slice(0,19)+'Z':null;}
function tarih(s){return s?s.replace('T',' ').replace('Z',''):'-';}
function kategoriKutulari(secili,hassasDahil=true){const kutular=[];
  const kap=h('div',{});KATEGORILER.filter(k=>hassasDahil||!k.hassas).forEach(k=>{
    const c=h('input',{type:'checkbox',value:k.kimlik,checked:secili?secili.includes(k.kimlik):false});kutular.push(c);
    kap.append(h('label',{},c,' ',k.ad,k.hassas?h('span',{class:'rozet h'},'hassas'):null));});
  kap.sec=()=>kutular.filter(c=>c.checked).map(c=>c.value);return kap;}

const SAYFALAR=[['harita','Harita'],['ana','Ana sayfa'],['ice','İçe aktar'],['ara','Arama'],['zaman','Zaman çizelgesi'],['persona','Persona'],['erisim','Erişim'],['kaynak','Kaynaklar'],['ayar','Ayarlar'],['hakkinda','Hakkında']];
let sayfa='harita',AYAR_TEMA='sistem',yoklama=null;
function menu(){const n=$('#nav');n.textContent='';SAYFALAR.forEach(([id,ad])=>n.append(h('button',{class:id===sayfa?'secili':'',onclick:()=>git(id)},ad)));}
function git(id){sayfa=id;menu();if(yoklama){clearInterval(yoklama);yoklama=null;}
  const a=$('#ana');a.textContent='';SF[id](a).catch(hataGoster);}
function temaUygula(t){document.documentElement.dataset.tema=t;AYAR_TEMA=t;}

const SF={};

// ------------------------------------------------------------------ kişiler
let KISILER={kisiler:[],secili:null},SECILI_BOLGE=null;
function haritaSifirla(){if(window.HARITA_DURUM)Object.assign(HARITA_DURUM,{bolge:null,filtre:{},kayit:null,karsilastir:null,grup:null,aralik:{tip:'tumu',baslangic:null,bitis:null}});}
async function kisileriYukle(){KISILER=await api('kisiler');kisiSecici();}
function kisiSecici(){const k=$('#kisi-kutu');k.textContent='';
  const sec=h('select',{'aria-label':'Kişi seç',onchange:async e=>{
    try{await api('kisi_sec',{kisi_id:e.target.value});SECILI_BOLGE=null;haritaSifirla();await kisileriYukle();bildir('Kişi değişti.');git(sayfa);}catch(x){hataGoster(x);kisileriYukle();}}},
    KISILER.kisiler.map(x=>h('option',{value:x.id,selected:x.secili},x.ad)));
  k.append(h('span',{class:'soluk'},'Kişi:'),sec,h('button',{class:'i',onclick:()=>kisiEkle()},'Kişi ekle'));}
async function kisiEkle(){
  const ac=await api('acilis');const ad=h('input',{type:'text',placeholder:'Kişinin adı'});const yol=h('input',{type:'text'});const sonuc=h('div',{class:'soluk'});
  const taban=ac.varsayilan_klasor;const ayr=taban.includes('\\')?'\\':'/';
  const oner=()=>{const slug=(ad.value||'kisi').toLowerCase().replace(/[^a-z0-9ğüşıöç]+/gi,'-');yol.value=taban+'-'+slug;den();};
  const den=async()=>{const r=await api('sihirbaz_denetle',{yol:yol.value}).catch(()=>null);sonuc.textContent='';if(!r)return;
    sonuc.append(h('div',{class:r.ok?'tamam':'kotu'},r.mesaj),h('div',{},'Bu sürücüdeki boş alan: '+r.bos_alan_metni));olustur.disabled=!r.ok||!ad.value.trim();};
  const olustur=h('button',{class:'d',disabled:true,onclick:async()=>{
    try{await api('kisi_ekle',{ad:ad.value,yol:yol.value});kapat();SECILI_BOLGE=null;haritaSifirla();await kisileriYukle();bildir('Kişi eklendi ve seçildi. Veri klasörü: '+yol.value);git('harita');}catch(e){hataGoster(e);}}},'Oluştur');
  ad.addEventListener('input',()=>{oner();});yol.addEventListener('input',den);
  const kapat=pencere('Kişi ekle',h('p',{class:'soluk'},'Her kişinin verisi ayrı bir klasörde durur; anahtarlar, izinler ve erişim kaydı da o klasöre bağlıdır.'),
    h('div',{class:'satir'},ad),h('div',{class:'satir'},yol,h('button',{class:'i',onclick:async()=>{const r=await api('sec',{tur:'klasor'}).catch(hataGoster);if(r&&r.yol){yol.value=r.yol;den();}}},'Seç…')),sonuc,
    h('div',{class:'satir'},olustur,h('button',{class:'i',onclick:()=>kapat()},'Vazgeç')));
  oner();}
SF.harita=async a=>HARITA.ekran(a);
// ------------------------------------------------------------------ ana sayfa
SF.ana=async a=>{
  const d=await api('durum');DURUM=d;KATEGORILER=d.kategoriler;
  a.append(h('h2',{},'Ana sayfa'));
  if(d.eskiyen>0)a.append(h('div',{class:'uyari'},`${d.eskiyen} bilginin süresi doldu ve "eskimiş" yapıldı; Persona ekranından yeniden doğrulayabilirsiniz.`));
  if(d.acik_celiski>0)a.append(h('div',{class:'uyari'},`${d.acik_celiski} çelişen bilgi seçiminizi bekliyor (Persona).`));
  const ac=await api('acilis');
  if(ac.yarim_is)a.append(h('div',{class:'uyari'},'Yarım kalmış bir içe aktarma var: '+ac.yarim_is.yol+' ',
    h('button',{class:'i',onclick:()=>{git('ice');setTimeout(()=>{const g=$('#ice-yol');if(g)g.value=ac.yarim_is.yol;},50);}},'Kaldığı yerden devam et')));
  const g=h('div',{class:'izgara'});
  const say=(ad,n)=>h('div',{class:'kart'},h('div',{class:'sayi'},String(n)),h('div',{class:'soluk'},ad));
  const c=d.ozet.counts||{};
  g.append(say('Kayıt',c.event||0),say('Kaynak',d.kaynak_sayisi),say('Persona bilgisi',c.fact||0),say('Uygulama anahtarı',c.app_key||0));
  a.append(g,h('div',{class:'kart'},h('div',{class:'soluk'},'Veri klasörü'),h('div',{},d.veri_klasoru)));
  const sk=h('div',{class:'kart'},h('h3',{},'Sağlık denetimi'),h('div',{id:'saglik-sonuc',class:'soluk'},'Henüz çalıştırılmadı.'),
    h('button',{class:'i',onclick:async()=>{const s=await api('saglik');const k=$('#saglik-sonuc');k.textContent='';
      s.kontroller.forEach(c=>k.append(h('div',{class:c.ok?'tamam':'kotu'},(c.ok?'✓ ':'✗ ')+c.ad+(c.ayrinti?': '+c.ayrinti:''))));}},'Denetle'));
  a.append(sk);
};
// ------------------------------------------------------------------ içe aktar
SF.ice=async a=>{
  const turler=(await api('turler')).turler;
  const serit=h('div',{class:'kart seridi',id:'ice-serit'});
  const seritYenile=async()=>{const d=await api('durum');const c=d.ozet.counts||{};serit.textContent='';
    [['Kayıt',c.event||0],['Kaynak',d.kaynak_sayisi],['Persona bilgisi',c.fact||0]].forEach(([ad,n])=>serit.append(h('div',{},h('b',{},SAYI(n)),' ',h('span',{class:'soluk'},ad))));};
  await seritYenile();
  const yol=h('input',{type:'text',id:'ice-yol',placeholder:'Zip dosyası ya da klasör yolu'});
  const tur=h('select',{},h('option',{value:''},'Otomatik tanı'),turler.map(t=>h('option',{value:t},t)));
  const alan=h('div',{});
  const sec=async k=>{const r=await api('sec',{tur:k});if(r.yol)yol.value=r.yol;};
  async function baslat(yineDe){
    alan.textContent='';
    await api('ice_aktar_baslat',{yol:yol.value,tur:tur.value||null,yine_de:!!yineDe});yokla();}
  function yokla(){if(yoklama)clearInterval(yoklama);
    yoklama=setInterval(async()=>{const s=await api('ice_aktar_durum').catch(()=>null);if(!s)return;ciz(s);
      if(s.durum!=='calisiyor'){clearInterval(yoklama);yoklama=null;seritYenile().catch(()=>{});}},700);}
  function ciz(s){alan.textContent='';
    if(s.durum==='calisiyor'){const ad={dogrula:'Dosya doğrulanıyor',kopyala:'Ham arşive kopyalanıyor',isle:'Kayıtlar işleniyor'}[s.asama]||s.asama;
      alan.append(h('div',{class:'kart'},h('div',{},`${ad}… ${s.sayi?s.sayi+' kayıt':''}`),h('progress',{}),h('div',{class:'soluk'},'Kapatırsanız aynı dosyayı yeniden verin: tekrar eden kayıtlar eklenmez, kalan devam eder.')));}
    else if(s.durum==='bitti')alan.append(h('div',{class:'kart'},h('h3',{class:'tamam'},'Tamamlandı'),h('pre',{},s.sonuc)));
    else if(s.durum==='hata'){
      alan.append(h('div',{class:'hata'},s.hata));
      if(s.bicim_raporu)alan.append(h('div',{class:'kart'},h('h3',{},'Biçim raporu'),yapistirmaKutusu(s.bicim_raporu),
        h('button',{class:'d',onclick:()=>kopyala(s.bicim_raporu)},'Biçim raporunu kopyala')));
      if(s.hata_kodu==='daha_once_silinmis')alan.append(h('div',{class:'satir'},h('span',{},'Daha önce kalıcı sildiğiniz bir girdi. Yine de alınsın mı?'),
        h('button',{class:'d',onclick:()=>baslat(true).catch(hataGoster)},'Evet, yine de al')));
      SON_HATA={adim:'içe aktar',mesaj:s.hata,ek:s.bicim_raporu||''};}}
  a.append(h('h2',{},'İçe aktar'),serit,h('div',{class:'kart'},
    h('p',{},'Google Takeout zip dosyası, Reddit veri dışa aktarımı ya da açılmış bir klasör seçin.'),
    h('div',{class:'satir'},yol),
    h('div',{class:'satir'},h('button',{class:'i',onclick:()=>sec('dosya').catch(hataGoster)},'Dosya seç…'),h('button',{class:'i',onclick:()=>sec('klasor').catch(hataGoster)},'Klasör seç…'),tur,
      h('button',{class:'d',onclick:()=>baslat(false).catch(hataGoster)},'İçe aktarmayı başlat'))),alan);
  const s=await api('ice_aktar_durum');if(s.durum!=='yok'){ciz(s);if(s.durum==='calisiyor')yokla();}
};
// ------------------------------------------------------------------ kayıt listesi
function kayitListesi(kayitlar,gizle){const k=h('div',{});
  if(!kayitlar.length)k.append(h('p',{class:'soluk'},'Kayıt yok.'));
  kayitlar.forEach(r=>k.append(h('div',{class:'kayit'},
    h('div',{class:'soluk'},tarih(r.zaman)+' · ',h('span',{class:'rozet'},r.kategori),' ',r.tur),
    h('div',{class:'m'},r.metin||'(metin yok)'),
    gizle?h('button',{class:'i',onclick:async e=>{if(!confirm('Bu kayıt gizlensin mi?'))return;await api('kayit_gizle',{olay_id:r.id}).catch(hataGoster);e.target.closest('.kayit').remove();}},'Gizle'):null)));
  return k;}
SF.ara=async a=>{
  if(!KATEGORILER.length)KATEGORILER=(await api('durum')).kategoriler;
  const q=h('input',{type:'search',placeholder:'Ara (Türkçe harf duyarsız)'});const kat=kategoriKutulari(null);const son=h('div',{});
  const git_=async()=>{son.textContent='';son.append(kayitListesi((await api('ara',{sorgu:q.value,kategoriler:kat.sec()})).kayitlar,true));};
  q.addEventListener('keydown',e=>{if(e.key==='Enter')git_().catch(hataGoster);});
  if(window.ARAMA_SORGU){q.value=window.ARAMA_SORGU;window.ARAMA_SORGU=null;setTimeout(()=>git_().catch(hataGoster),0);}
  a.append(h('h2',{},'Arama'),h('div',{class:'kart'},h('div',{class:'satir'},q,h('button',{class:'d',onclick:()=>git_().catch(hataGoster)},'Ara')),h('div',{class:'soluk'},'Kategori seçmezseniz hepsinde aranır.'),kat),son);};
SF.zaman=async a=>{
  if(!KATEGORILER.length)KATEGORILER=(await api('durum')).kategoriler;
  const kat=kategoriKutulari(null);const b=h('input',{type:'date'}),e=h('input',{type:'date'});const son=h('div',{});let atla=0;
  const yukle=async ilk=>{if(ilk){atla=0;son.textContent='';}
    const r=await api('zaman',{kategoriler:kat.sec(),baslangic:b.value?b.value+'T00:00:00Z':null,bitis:e.value?e.value+'T23:59:59Z':null,limit:100,atla});
    atla+=r.kayitlar.length;son.querySelector('.daha')?.remove();son.append(kayitListesi(r.kayitlar,true));
    if(r.kayitlar.length===100)son.append(h('button',{class:'i daha',onclick:()=>yukle(false).catch(hataGoster)},'Daha fazla'));};
  a.append(h('h2',{},'Zaman çizelgesi'),h('div',{class:'kart'},kat,h('div',{class:'satir'},'Başlangıç ',b,' Bitiş ',e,h('button',{class:'d',onclick:()=>yukle(true).catch(hataGoster)},'Göster'))),son);
  yukle(true).catch(hataGoster);};
// ------------------------------------------------------------------ persona
let PERSONA_SEKME='bilgiler';
const ONERI_KOMUT=`Sohbet geçmişimi tara ve persona önerileri yaz. Önce \`kategorileri_listele\` ile neye iznin olduğuna bak, sonra \`ornekle\` ve \`ara\` ile sohbet kayıtlarından örnekler al. Benim hakkımda kalıcı, tekrar eden bilgileri (nerede yaşadığım, işim, cihazlarım, projelerim, tercihlerim) bul ve her biri için \`persona_oner\` ile öneri yaz; her öneride dayandığın kayıtların \`id\` değerlerini \`kanit\` olarak ver. Tahmin yürütme, emin olmadığını yazma. Yazdıklarını onaylamadan persona değişmeyeceğini unutma; daha önce reddettiğim öneriler kuyruğa girmez.`;
function oneriYardim(){return h('details',{class:'kart hud yardim'},h('summary',{},'Öneriler nasıl üretilir?'),
  h('p',{},'Claude gibi bir yapay zekâ, izin verdiğiniz kayıtlara bakıp sizin hakkınızda kalıcı bilgiler ',h('b',{},'önerir'),'. Öneri yalnızca bu kuyruğa düşer; ',h('b',{},'siz onaylamadan persona değişmez'),'. Önerinin dayandığı kayıtları açıp kendiniz kontrol edebilirsiniz.'),

        yapistirmaKutusu(son.baglanti.metin),h('div',{class:'satir'},h('button',{class:'d',onclick:()=>{k.textContent='';start();}},'Başla'))];}
    k.append(h('div',{class:'yer'},h('div',{class:'pencere'},h('h2',{},`İlk açılış (${adim}/3)`),...icerik)));};
  ciz();}
async function start(){
  const ac=await api('acilis');temaUygula(ac.tema);
  if(ac.baslangic_hatasi)bildir('Başlangıç hatası: '+ac.baslangic_hatasi,true);
  if(ac.sihirbaz){menu();$('#ana').textContent='';return sihirbaz(ac);}
  await kisileriYukle();
  git('harita');}
menu();start().catch(hataGoster);
</script>
