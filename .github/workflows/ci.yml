name: ci

# Hızlı birim testleri: her push ve PR'da, yalnızca ubuntu (Windows testleri tam.yml'de).
# Büyük (`buyuk`) testler burada ÇALIŞMAZ.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            server/pyproject.toml
            importers/pyproject.toml
            windows/pyproject.toml
      - name: Kurulum (core, server, varsa importers)
        run: |
          pkgs="-e core -e server"
          if [ -f importers/pyproject.toml ]; then pkgs="$pkgs -e importers"; fi
          if [ -f windows/pyproject.toml ]; then pkgs="$pkgs -e windows"; fi
          python -m pip install $pkgs pytest
      - name: core testleri
        run: python -m pytest core -m "not buyuk"
      - name: server testleri
        run: python -m pytest server
      - name: importers testleri
        if: hashFiles('importers/pyproject.toml') != ''
        run: python -m pytest importers -m "not buyuk"
      - name: Tarayıcı testi için Playwright (yalnız 3.13 işi; gerçek Chromium ile arayüz gezintisi)
        if: matrix.python == '3.13'
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "KIMLIK_PLAYWRIGHT_YOLU=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "KIMLIK_TARAYICI_ZORUNLU=1" >> "$GITHUB_ENV"
      - name: windows (arayüzden bağımsız mantık + gerçek tarayıcı) testleri
        if: hashFiles('windows/pyproject.toml') != ''
        run: python -m pytest windows -rs
      - name: Tarayıcı testi atlanmadı mı (yalnız 3.13; atlanırsa ZORUNLU=1 ile kırmızı)
        if: matrix.python == '3.13'
        shell: bash
        run: python -m pytest windows/tests/test_tarayici.py -rs -v 2>&1 | tee "$RUNNER_TEMP/tarayici.log"; ! grep -q SKIPPED "$RUNNER_TEMP/tarayici.log"
      - name: entegrasyon testleri
        run: python -m pytest entegrasyon -m "not buyuk"
