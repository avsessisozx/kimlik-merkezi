[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimlikcore"
version = "0.1.0"
description = "Kimlik Merkezi çekirdek kütüphanesi (SQLite, ham arşiv, Türkçe FTS5)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kimlikmerkezi = "kimlikcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not buyuk'"
markers = [
    "buyuk: ~2 GB sentetik dosya testi; varsayılan çalıştırmada atlanır (pytest -m buyuk ile çalıştırın)",
]
